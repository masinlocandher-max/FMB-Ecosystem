name: FMB News V9 Final Visual QA Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build exact generated site
        run: npm run build

      - name: Package FMB News visual QA files
        uses: actions/upload-artifact@v4
        with:
          name: fmbnews-v9-final-visual-qa
          path: |
            dist/fmbnews
            dist/news
            dist/assets
            dist/manifest.webmanifest
          if-no-files-found: error
          retention-days: 1
