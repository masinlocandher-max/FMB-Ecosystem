name: FMB News supplied logo QA

on:
  pull_request:
    paths:
      - 'apps/withlovefmb/assets/images/fmb-approved/fmb-news-logo-*-supplied.webp'
      - 'scripts/post-build-fmbnews-submit-story.mjs'
      - 'scripts/qa-fmbnews-logo-variants-playwright.mjs'
      - '.github/workflows/fmbnews-logo-variants-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplied-logo-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install repository and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Build the complete ecosystem
        run: npm run build

      - name: Serve the generated site
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/fmbnews-logo-server.log 2>&1 &
          echo $! > /tmp/fmbnews-logo-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/fmbnews/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fmbnews-logo-server.log
          exit 1

      - name: Run desktop and mobile Chromium QA
        env:
          FMBNEWS_QA_URL: http://127.0.0.1:4173
          FMBNEWS_QA_EVIDENCE: fmbnews-logo-variants-evidence
        run: node scripts/qa-fmbnews-logo-variants-playwright.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmbnews-logo-variants-evidence
          path: |
            fmbnews-logo-variants-evidence
            /tmp/fmbnews-logo-server.log
          if-no-files-found: warn
          retention-days: 14
