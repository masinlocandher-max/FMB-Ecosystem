name: One-time verify domain separation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-verify-domain-separation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_KRSlI8wfigrmTrcCfbLIu9C6
      OLD_PROJECT: withlovefmb
      NEW_PROJECT: pco

    steps:
      - name: Verify domain ownership from Vercel domain endpoints
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          old="$(curl --fail --silent --show-error "${auth[@]}" "$api/v9/projects/$OLD_PROJECT/domains?teamId=$VERCEL_TEAM_ID")"
          new="$(curl --fail --silent --show-error "${auth[@]}" "$api/v9/projects/$NEW_PROJECT/domains?teamId=$VERCEL_TEAM_ID")"
          echo 'OLD_PROJECT_DOMAIN_NAMES:'
          printf '%s' "$old" | jq -r '.domains[].name' | sort
          echo 'NEW_PROJECT_DOMAIN_NAMES:'
          printf '%s' "$new" | jq -r '.domains[].name' | sort
          if printf '%s' "$old" | jq -e '.domains | map(.name) | index("francinemariebautista.com") != null or index("www.francinemariebautista.com") != null' >/dev/null; then exit 1; fi
          printf '%s' "$new" | jq -e '.domains | map(.name) | index("francinemariebautista.com") != null' >/dev/null
          printf '%s' "$new" | jq -e '.domains | map(.name) | index("www.francinemariebautista.com") != null' >/dev/null
          echo 'PASS: apex and www belong to PCO, not withlovefmb.'

      - name: Diagnose live host responses
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://francinemariebautista.com/' \
            'https://www.francinemariebautista.com/' \
            'https://www.francinemariebautista.com/news/' \
            'https://pco-sigma.vercel.app/' \
            'https://pco-sigma.vercel.app/news/' \
            'https://fmb-news.info-senz-pr.workers.dev/news/'
          do
            echo "===== $url ====="
            file="/tmp/$(printf '%s' "$url" | tr -cs '[:alnum:]' '_').body"
            headers="${file}.headers"
            code="$(curl --silent --show-error --location --max-redirs 8 -D "$headers" -o "$file" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$code"
            grep -Ei '^(server|location|x-fmb-news-worker|x-vercel-id|x-vercel-error|cf-ray|via|content-type):' "$headers" || true
            printf 'BODY_HEAD='
            head -c 240 "$file" | tr '\n' ' ' || true
            echo
          done
