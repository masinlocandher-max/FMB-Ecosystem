name: Diagnose fmb-pco preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-fmb-pco-preflight.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose fmb-pco preflight'
    runs-on: ubuntu-latest
    steps:
      - name: Check stable PCO deployment paths
        shell: bash
        run: |
          set -u
          for url in \
            'https://fmb-pco.vercel.app/' \
            'https://fmb-pco.vercel.app/news' \
            'https://fmb-pco.vercel.app/news/' \
            'https://fmb-pco.vercel.app/news/world/' \
            'https://fmb-pco.vercel.app/news/sara-duterte-arrest-warrant-grave-threats-september-4-2026/' \
            'https://fmb-news.info-senz-pr.workers.dev/news/' \
            'https://fmb-news.info-senz-pr.workers.dev/news/world/' \
            'https://fmb-news.info-senz-pr.workers.dev/news/sara-duterte-arrest-warrant-grave-threats-september-4-2026/'
          do
            echo "=== ${url} ==="
            rm -f /tmp/h /tmp/b
            curl -sS -L -o /tmp/b -D /tmp/h -w 'HTTP %{http_code}\n' --max-time 30 -H 'Cache-Control: no-cache' "${url}?diag=${GITHUB_SHA}" || true
            tr -d '\r' < /tmp/h | grep -Ei '^(HTTP/|server:|location:|x-fmb-news-worker:|x-vercel-|cf-cache-status:)' || true
            echo 'BODY:'
            head -c 260 /tmp/b | tr '\n' ' ' || true
            echo
          done
