name: Phase 1 release equivalence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare-release-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install repository dependencies
        run: npm install --no-fund
      - name: Audit current release ledger
        run: node scripts/audit-build-ledger.mjs
      - name: Build current full release ledger
        run: npm run build
      - name: Preserve ledger output
        run: mv dist dist-ledger
      - name: Build Phase 1 late-source candidate
        run: node --import ./scripts/fetch-shim.mjs scripts/build-phase1-candidate.mjs
      - name: Preserve candidate output
        run: mv dist dist-candidate
      - name: Compare outputs byte-for-byte
        run: node scripts/compare-release-paths.mjs dist-ledger dist-candidate
