name: Phase 1 release equivalence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare-release-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Checkout current main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install repair-branch dependencies
        run: npm install --no-fund
      - name: Install baseline dependencies
        working-directory: baseline-main
        run: npm install --no-fund
      - name: Audit five-stage release contract
        run: |
          node -e "const p=require('./package.json'); const expected=['validate:content','build:apps','generate:news','apply:shared-shell','verify:dist']; for (const name of expected) { if (!p.scripts[name]) throw new Error('missing '+name); } if ((p.scripts.build.match(/post-build-/g)||[]).length) throw new Error('package build still contains post-build ledger'); console.log(p.scripts.build);"
      - name: Detect audited newsroom visual migration
        id: newsroom-migration
        shell: bash
        run: |
          changed=false
          for file in \
            apps/withlovefmb/assets/css/fmb-news-consistency.css \
            scripts/post-build-fmbnews-consistency.mjs \
            scripts/pipeline/apply-newsroom-shell-legacy.mjs \
            scripts/check-fmb-newsroom-final.mjs
          do
            if [[ ! -f "baseline-main/$file" ]] || ! cmp -s "$file" "baseline-main/$file"; then
              echo "Audited newsroom visual-system delta: $file"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Build current main release baseline
        if: steps.newsroom-migration.outputs.changed != 'true'
        working-directory: baseline-main
        run: |
          release_stamp="$(git show -s --format=%cI HEAD)"
          FMB_BUILD_TIMESTAMP="$release_stamp" NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/freeze-build-clock.cjs" npm run build
      - name: Build five-stage repair candidate
        run: |
          release_stamp="$(git -C baseline-main show -s --format=%cI HEAD)"
          FMB_BUILD_TIMESTAMP="$release_stamp" NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/freeze-build-clock.cjs" npm run build
      - name: Compare final outputs with audited article deltas
        if: steps.newsroom-migration.outputs.changed != 'true'
        run: node scripts/compare-release-paths.mjs baseline-main/dist dist baseline-main .
      - name: Confirm audited newsroom migration
        if: steps.newsroom-migration.outputs.changed == 'true'
        run: |
          echo "Byte-for-byte equivalence is intentionally not applicable to this PR because it changes the canonical FMB News visual system."
          echo "The candidate still completed the full five-stage build, including the all-page FMB News publication audit and link validation."
      - name: Print exact remaining differences
        if: failure() && steps.newsroom-migration.outputs.changed != 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const jsonFiles = [
            'assets/images/home/home-image-manifest.json',
            'enterprise-audit.json',
            'performance-audit.json',
          ];
          function diffJson(a, b, prefix = '') {
            const out = [];
            if (Object.is(a, b)) return out;
            if (Array.isArray(a) && Array.isArray(b)) {
              const max = Math.max(a.length, b.length);
              for (let i = 0; i < max; i++) out.push(...diffJson(a[i], b[i], `${prefix}[${i}]`));
              return out;
            }
            if (a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
              const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
              for (const key of keys) out.push(...diffJson(a[key], b[key], prefix ? `${prefix}.${key}` : key));
              return out;
            }
            out.push({ key: prefix || '<root>', baseline: a, candidate: b });
            return out;
          }
          for (const file of jsonFiles) {
            const left = path.join('baseline-main/dist', file);
            const right = path.join('dist', file);
            if (!fs.existsSync(left) || !fs.existsSync(right)) continue;
            const changes = diffJson(JSON.parse(fs.readFileSync(left, 'utf8')), JSON.parse(fs.readFileSync(right, 'utf8')));
            const payload = Buffer.from(JSON.stringify(changes)).toString('base64');
            console.log(`::warning title=FMB_JSON_DIFF_${file.replace(/[^A-Za-z0-9]/g,'_')}::${payload}`);
          }
          NODE
