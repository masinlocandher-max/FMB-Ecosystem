name: Clean homepage dependencies

on:
  push:
    branches: [cleanup/fmb-ecosystem-hygiene-20260820]
    paths: [.github/workflows/clean-homepage-dependencies.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fmb-ecosystem-hygiene-20260820
          fetch-depth: 0
      - name: Remove retired homepage dependencies
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          site = repo / 'apps' / 'withlovefmb'
          me = repo / '.github' / 'workflows' / 'clean-homepage-dependencies.yml'

          # Homepage is already source-cleaned. Assert that no retired surface came back.
          home = site / 'index.html'
          s = home.read_text()
          if 'yoni.francinemariebautista.com' in s or '/assets/images/yoni/' in s:
              raise SystemExit('Homepage still contains a Yoni dependency')
          if '/music/' in s or '/ebooks/' in s or '/profile/' in s or '/auth.html' in s:
              raise SystemExit('Homepage still contains a retired product/account route')

          # Active post-build shell must not re-inject parked/retired surfaces.
          shell = repo / 'scripts' / 'post-build-fmb-unified-design.mjs'
          s = shell.read_text()
          s = re.sub(r'\n\s*<a class="fmb-shell-yoni" href="https://yoni\.francinemariebautista\.com/">Open Yoni</a>', '', s)
          s = s.replace('      <a href="https://yoni.francinemariebautista.com/">Yoni</a>\n', '')
          s = s.replace('Yoni, Mabayani, community programs, advocacy campaigns, and future projects', 'Mabayani, community programs, advocacy campaigns, and future projects')
          s = s.replace('With Love, FMB, Yoni, Mabayani, and FMB News', 'With Love, FMB, Mabayani, and FMB News')
          s = s.replace('media, photography, music, and digital products', 'media, photography, audiovisual production, and digital products')
          s = re.sub(r'\n\s*<article class="bulletin-feature">[\s\S]*?</article>', '', s, count=1)
          if 'yoni.francinemariebautista.com' in s or '/assets/images/yoni/' in s:
              raise SystemExit('Active post-build shell still injects Yoni')
          if '/music/' in s or '/ebooks/' in s:
              raise SystemExit('Active post-build shell still injects retired product routes')
          shell.write_text(s)

          # Homepage-linked participation page must not advertise retired products.
          involved = site / 'get-involved' / 'index.html'
          s = involved.read_text().replace(
              'language preservation, books, music, community access, or a defined public project',
              'language preservation, public resources, community access, or a defined public project'
          )
          involved.write_text(s)

          # Remove obsolete homepage injectors only when nothing else references them.
          legacy = [
              repo / 'scripts' / 'post-build-fmb-approved-dashboard.mjs',
              repo / 'scripts' / 'post-build-fmb-approved-launch.mjs',
          ]
          searchable = []
          for f in repo.rglob('*'):
              if not f.is_file() or '.git' in f.parts or f in legacy or f == me:
                  continue
              if f.suffix.lower() not in {'.mjs','.js','.json','.yml','.yaml','.md','.html'}:
                  continue
              try:
                  searchable.append((f, f.read_text()))
              except Exception:
                  pass
          for target in legacy:
              if not target.exists():
                  continue
              refs = [str(f) for f, text in searchable if target.name in text]
              if refs:
                  raise SystemExit(f'Will not delete referenced legacy injector {target.name}: {refs}')
              target.unlink()

          if me.exists():
              me.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/post-build-fmb-unified-design.mjs apps/withlovefmb/get-involved/index.html scripts/post-build-fmb-approved-dashboard.mjs scripts/post-build-fmb-approved-launch.mjs .github/workflows/clean-homepage-dependencies.yml
          git diff --cached --stat
          git commit -m "Remove hidden retired homepage injectors"
          git push origin HEAD:cleanup/fmb-ecosystem-hygiene-20260820
