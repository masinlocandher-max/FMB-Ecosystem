name: Final Orchestrator boundary prune

on:
  push:
    branches: [cleanup/fmb-ecosystem-hygiene-20260820]
    paths: [.github/workflows/final-orchestrator-boundary-prune.yml]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fmb-ecosystem-hygiene-20260820
          fetch-depth: 0
      - name: Remove final public-membership assumptions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, shutil
          repo=Path('.')
          site=repo/'apps/withlovefmb'

          # The remaining profile dashboard is entirely the retired public member system.
          profile=site/'profile'
          if profile.exists(): shutil.rmtree(profile)

          # Private Orchestrator auth now uses its dedicated admin login only.
          adminjs=site/'assets/js/admin.js'
          s=adminjs.read_text()
          s=s.replace("location.replace('auth.html#signin')", "location.replace('/admin-login.html')")
          s=s.replace("location.replace('auth.html?next=%2Fadmin.html#signin')", "location.replace('/admin-login.html')")
          s=s.replace("setTimeout(()=>location.replace('/profile/'),900)", "setTimeout(()=>location.replace('/admin-login.html'),900)")
          s=s.replace("['membersCommunityPanel','membersPanel','moderationPanel','contentPanel','mediaPanel','messagesPanel']",
                      "['moderationPanel','contentPanel','mediaPanel','messagesPanel']")
          adminjs.write_text(s)

          # Enterprise release audit must require only active routes.
          audit=repo/'scripts/audit-fmb-enterprise.mjs'
          s=audit.read_text()
          s=s.replace("if(name==='index.html'||/^(aboutfmb|withlovefmb|news|music|ebooks|fmbandco)\\//.test(name))",
                      "if(name==='index.html'||/^(aboutfmb|withlovefmb|news|fmbandco)\\//.test(name))")
          s=s.replace("const requiredRoutes=['index.html','aboutfmb/index.html','withlovefmb/index.html','communityengagements/index.html','news/index.html','music/index.html','ebooks/index.html','fmbandco/index.html','app/index.html','app/install/index.html'];",
                      "const requiredRoutes=['index.html','aboutfmb/index.html','withlovefmb/index.html','communityengagements/index.html','news/index.html','fmbandco/index.html'];")
          audit.write_text(s)

          # Orchestrator checker protects private admin/CMS surfaces, not deleted public products/accounts.
          check=site/'scripts/check-orchestrator.mjs'
          s=check.read_text()
          s=s.replace('  authSource,\n','')
          s=s.replace("  readFile(path.join(siteRoot, 'assets/js/auth.js'), 'utf8'),\n",'')
          for panel in ("  'membersCommunityPanel',\n","  'membersPanel',\n","  'musicPanel',\n"):
            s=s.replace(panel,'')
          for route in ("  'ebooks/index.html',\n","  'music/index.html',\n","  'profile/index.html',\n","  'app/index.html',\n"):
            s=s.replace(route,'')
          s=s.replace("assert.match(adminSource, /auth\\.html\\?next=%2Fadmin\\.html#signin/);",
                      "assert.match(adminSource, /admin-login\\.html/);")
          s=s.replace("assert.match(authSource, /target\\.origin===location\\.origin/);\n",'')
          s=s.replace('public routes.`);','public routes.`);')
          check.write_text(s)

          # Remove now-unused member-only presentation layer if nothing else references it.
          dashboard=site/'assets/css/dashboard.css'
          if dashboard.exists():
            refs=[]
            for f in site.rglob('*'):
              if f.is_file() and f!=dashboard and f.suffix.lower() in {'.html','.js','.css'}:
                try:
                  if 'dashboard.css' in f.read_text(): refs.append(f)
                except Exception: pass
            if not refs: dashboard.unlink()

          me=repo/'.github/workflows/final-orchestrator-boundary-prune.yml'
          if me.exists(): me.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove final public membership and retired route assumptions"
          git push origin HEAD:cleanup/fmb-ecosystem-hygiene-20260820
