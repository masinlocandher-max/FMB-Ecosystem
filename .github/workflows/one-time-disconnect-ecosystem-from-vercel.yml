name: One-time disconnect FMB-Ecosystem from Vercel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-disconnect-ecosystem-from-vercel.yml'

permissions:
  contents: read

jobs:
  disconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_KRSlI8wfigrmTrcCfbLIu9C6
      VERCEL_TEAM_SLUG: senz3
      OLD_PROJECT_ID: prj_NQROYIgMZ5bvNeRBhhH5wPTuGZeL
      OLD_PROJECT: withlovefmb

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Vercel credential
        run: test -n "$VERCEL_TOKEN"

      - name: Link temporary workspace to legacy project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vercel-detach/.vercel
          cat > /tmp/vercel-detach/.vercel/project.json <<JSON
          {"projectId":"$OLD_PROJECT_ID","orgId":"$VERCEL_TEAM_ID"}
          JSON

      - name: Disconnect GitHub repository from legacy Vercel project
        shell: bash
        working-directory: /tmp/vercel-detach
        run: |
          set -euo pipefail
          npx --yes vercel@56.5.0 git disconnect --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG"

      - name: Verify FMB-Ecosystem is no longer Git-linked in Vercel
        shell: bash
        run: |
          set -euo pipefail
          project="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$OLD_PROJECT?teamId=$VERCEL_TEAM_ID")"
          repo="$(printf '%s' "$project" | jq -r '.link.repo // empty')"
          if [ -n "$repo" ]; then
            echo "Refusing success: legacy Vercel project is still linked to Git repository: $repo"
            exit 1
          fi
          echo 'Verified: withlovefmb has no Git repository connection.'
