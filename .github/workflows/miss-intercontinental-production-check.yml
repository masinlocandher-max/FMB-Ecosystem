name: Miss Intercontinental production check

# Smoke-tests the live application microsite on the custom domain.
# Manual only: it verifies production, it does not gate any deployment.

on:
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify https://www.francinemariebautista.com/MissIntercontinental
        run: |
          set -uo pipefail
          BASE="https://www.francinemariebautista.com"
          URL="$BASE/MissIntercontinental"
          FAILURES=0
          note() { printf '%s\n' "$1"; }
          fail() { printf '::error::%s\n' "$1"; FAILURES=$((FAILURES+1)); }

          note "=============================================="
          note " 1. Route responds on the custom domain"
          note "=============================================="
          CODE=$(curl -sS -o /tmp/page.html -w '%{http_code}' -L --max-time 45 "$URL" || echo 000)
          FINAL=$(curl -sS -o /dev/null -w '%{url_effective}' -L --max-time 45 "$URL" || echo none)
          note "GET $URL -> $CODE (final: $FINAL)"
          note "bytes: $(wc -c < /tmp/page.html)"
          [ "$CODE" = "200" ] || fail "route did not return 200 (got $CODE)"
          grep -q "Francine" /tmp/page.html || fail "page body does not contain the expected content"

          note ""
          note "=============================================="
          note " 2. No FMB corporate shell"
          note "=============================================="
          for M in fmb-shell-header fmb-shell-footer fmb-shell-rail fmb-shell-nav \
                   fmb-unified-public fmb-unified-system.css fmb-unified-system.js \
                   fmb-sitewide-visual-fixes.css "Explore the ecosystem" "Work with FMB" "/work-with-fmb/"; do
            if grep -qF -- "$M" /tmp/page.html; then fail "corporate shell marker present: $M"; else note "absent: $M"; fi
          done

          note ""
          note "=============================================="
          note " 3. No sibling-brand chrome"
          note "=============================================="
          for B in SENZ Cognita Yoni "FMB&CO." "FMB&amp;CO."; do
            if grep -qiF -- "$B" /tmp/page.html; then fail "sibling brand present: $B"; else note "absent: $B"; fi
          done

          note ""
          note "=============================================="
          note " 4. Portfolio images referenced and reachable"
          note "=============================================="
          grep -oE '/MissIntercontinental/assets/img/[A-Za-z0-9._-]+\.webp' /tmp/page.html | sort -u > /tmp/imgs.txt
          COUNT=$(wc -l < /tmp/imgs.txt)
          note "distinct images referenced: $COUNT"
          [ "$COUNT" -ge 25 ] || fail "expected at least 25 images, found $COUNT"
          for G in study-pride study-queen study-pubmat study-sash study-crown \
                   pageant-ms-gay-zambales speaking-01 portrait-front; do
            grep -q "$G" /tmp/imgs.txt || fail "missing visual category or photograph: $G"
          done
          BAD=0
          while read -r P; do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$P" || echo 000)
            if [ "$C" != "200" ]; then fail "image did not return 200 ($C): $P"; BAD=$((BAD+1)); fi
          done < /tmp/imgs.txt
          note "images returning 200: $((COUNT-BAD))/$COUNT"

          note ""
          note "=============================================="
          note " 5. Audio gate"
          note "=============================================="
          grep -q 'id="gate"' /tmp/page.html || fail "entry gate markup missing"
          grep -q 'id="gateSound"' /tmp/page.html || fail "'enter with music' control missing"
          grep -q 'id="gateSilent"' /tmp/page.html || fail "'enter silently' control missing"
          grep -q 'id="audioToggle"' /tmp/page.html || fail "music toggle missing"
          if grep -qE '<audio[^>]*autoplay' /tmp/page.html; then fail "audio is set to autoplay"; else note "no autoplay attribute"; fi
          AC=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/MissIntercontinental/assets/audio/opening-music.mp3" || echo 000)
          AT=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 60 "$BASE/MissIntercontinental/assets/audio/opening-music.mp3" || echo none)
          note "opening-music.mp3 -> $AC ($AT)"
          [ "$AC" = "200" ] || fail "opening music did not return 200 (got $AC)"

          note ""
          note "=============================================="
          note " 6. Mobile layout contract"
          note "=============================================="
          grep -q 'viewport-fit=cover' /tmp/page.html || fail "viewport-fit=cover missing"
          grep -q 'width=device-width' /tmp/page.html || fail "responsive viewport missing"
          grep -q 'class="dock"' /tmp/page.html || fail "mobile dock missing"
          curl -sS -L --max-time 45 "$BASE/MissIntercontinental/app.css" -o /tmp/app.css || true
          grep -q 'env(safe-area-inset-bottom)' /tmp/app.css || fail "stylesheet lacks iPhone safe-area handling"
          grep -q 'prefers-reduced-motion' /tmp/app.css || fail "stylesheet lacks reduced-motion handling"
          grep -q 'max-width:680px' /tmp/app.css || grep -q 'max-width: 680px' /tmp/app.css || fail "mobile breakpoint missing from stylesheet"

          note ""
          note "=============================================="
          note " 7. CSS / JS / favicon reachable"
          note "=============================================="
          for P in /MissIntercontinental/app.css /MissIntercontinental/app.js /MissIntercontinental/assets/favicon.svg; do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$P" || echo 000)
            note "$P -> $C"
            [ "$C" = "200" ] || fail "$P did not return 200 (got $C)"
          done

          note ""
          note "=============================================="
          note " 8. No third-party media hosts"
          note "=============================================="
          if grep -qE 'raw\.githubusercontent\.com|drive\.google\.com|googleusercontent\.com' /tmp/page.html; then
            fail "page references media from a third-party host"
          else
            note "all media is first-party"
          fi

          note ""
          note "=============================================="
          if [ "$FAILURES" -eq 0 ]; then
            note "PRODUCTION VERIFICATION PASSED"
          else
            note "PRODUCTION VERIFICATION FAILED: $FAILURES problem(s)"
          fi
          note "=============================================="
          exit $FAILURES

  verify-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Playwright
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@latest >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Drive the live page in a real browser
        run: |
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright';
          const URL = 'https://www.francinemariebautista.com/MissIntercontinental';
          const b = await chromium.launch();
          let failures = 0;
          const fail = (m) => { console.log(`::error::${m}`); failures++; };

          // ---- behaviour: entry gate + audio, on a phone viewport
          const c = await b.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const p = await c.newPage();
          const bad = [];
          p.on('requestfailed', r => bad.push(`${r.url()} :: ${r.failure()?.errorText}`));
          const errs = [];
          p.on('pageerror', e => errs.push(e.message));
          p.on('console', m => { if (m.type() === 'error') errs.push(m.text()); });
          await p.goto(URL, { waitUntil: 'networkidle', timeout: 90000 });

          console.log('=== audio gate (live, 390px) ===');
          const gateVisible = await p.locator('#gate').isVisible();
          console.log('gate shown on load        :', gateVisible);
          if (!gateVisible) fail('entry gate did not appear');
          const autoplayed = await p.evaluate(() => !document.getElementById('openingMusic').paused);
          console.log('autoplayed before choice  :', autoplayed, '(must be false)');
          if (autoplayed) fail('audio started without a user gesture');
          await p.locator('#gateSound').click();
          await p.waitForTimeout(3000);
          const playing = await p.evaluate(() => !document.getElementById('openingMusic').paused);
          const dur = await p.evaluate(() => Math.round(document.getElementById('openingMusic').duration || 0));
          console.log('playing after "with music":', playing);
          console.log('track duration (s)        :', dur);
          if (!playing) fail('music did not start after the gate button was clicked');
          if (!dur) fail('audio metadata did not load from production');
          await p.locator('#audioToggle').click();
          await p.waitForTimeout(800);
          const paused = await p.evaluate(() => document.getElementById('openingMusic').paused);
          console.log('pill pauses playback      :', paused);
          if (!paused) fail('music pill did not pause playback');
          const gateGone = (await p.locator('#gate').count()) === 0;
          console.log('gate dismissed            :', gateGone);
          if (!gateGone) fail('gate did not dismiss');

          console.log('');
          console.log('=== lightbox (live) ===');
          await p.locator('#studies').scrollIntoViewIfNeeded();
          await p.waitForTimeout(1200);
          await p.locator('.plate').first().click();
          await p.waitForTimeout(2500);
          const open = await p.locator('#viewer').evaluate(e => e.classList.contains('is-open'));
          const loaded = await p.locator('#viewerImage').evaluate(i => i.naturalWidth > 0);
          console.log('viewer opens              :', open);
          console.log('full-size image loads     :', loaded);
          if (!open) fail('lightbox did not open');
          if (!loaded) fail('lightbox image did not load from production');
          await p.keyboard.press('Escape');
          await p.waitForTimeout(700);
          const closed = await p.locator('#viewer').evaluate(e => !e.classList.contains('is-open'));
          console.log('Escape closes it          :', closed);
          if (!closed) fail('lightbox did not close');
          await c.close();

          console.log('');
          console.log('=== responsive layout (live) ===');
          for (const [w, h, label] of [[375,812,'iPhone SE/13 mini'],[390,844,'iPhone 14/15'],[430,932,'iPhone Pro Max'],[768,1024,'iPad portrait'],[1440,900,'desktop']]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h } });
            const q = await ctx.newPage();
            await q.goto(URL, { waitUntil: 'networkidle', timeout: 90000 });
            await q.locator('#gateSilent').click();
            await q.waitForTimeout(900);
            const hh = await q.evaluate(() => document.body.scrollHeight);
            for (let y = 0; y < hh; y += 700) { await q.evaluate(v => scrollTo({top:v,behavior:'instant'}), y); await q.waitForTimeout(120); }
            await q.waitForTimeout(1500);
            const overflow = await q.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            const dock = await q.locator('.dock').isVisible();
            const nav  = await q.locator('.topbar nav').isVisible();
            const broken = await q.evaluate(() => [...document.images].filter(i => i.getAttribute('src') && (!i.complete || i.naturalWidth === 0)).length);
            const hidden = await q.evaluate(() => [...document.querySelectorAll('.reveal')].filter(e => !e.classList.contains('in-view')).length);
            console.log(`${String(w).padStart(4)}px ${label.padEnd(18)} overflowX=${overflow}px dock=${dock} topnav=${nav} brokenImgs=${broken} unrevealed=${hidden}`);
            if (overflow > 0) fail(`${w}px: horizontal overflow of ${overflow}px`);
            if (broken > 0) fail(`${w}px: ${broken} broken image(s)`);
            if (w <= 680 && !dock) fail(`${w}px: mobile dock not visible`);
            if (w > 1000 && !nav) fail(`${w}px: desktop navigation not visible`);
            await ctx.close();
          }

          console.log('');
          console.log('failed requests :', bad.length ? bad : 'none');
          console.log('console errors  :', errs.length ? errs : 'none');
          if (bad.length) fail(`${bad.length} request(s) failed on production`);

          await b.close();
          console.log('');
          console.log(failures === 0 ? 'LIVE RENDERING VERIFICATION PASSED' : `LIVE RENDERING VERIFICATION FAILED: ${failures}`);
          process.exit(failures);
          JS
          node check.mjs
