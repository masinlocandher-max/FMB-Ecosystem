name: One-time migrate main domain to PCO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-migrate-main-domain-to-pco.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_KRSlI8wfigrmTrcCfbLIu9C6
      VERCEL_TEAM_SLUG: senz3
      OLD_PROJECT: withlovefmb
      NEW_PROJECT: pco

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require migration credential
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Create or verify canonical PCO project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json')
          response="$(curl -sS -w '\n%{http_code}' "${auth[@]}" "$api/v9/projects/$NEW_PROJECT?teamId=$VERCEL_TEAM_ID")"
          status="$(printf '%s\n' "$response" | tail -n1)"
          body="$(printf '%s\n' "$response" | sed '$d')"

          if [ "$status" = '404' ]; then
            body="$(curl --fail --silent --show-error \
              -X POST "${auth[@]}" \
              "$api/v11/projects?teamId=$VERCEL_TEAM_ID" \
              -d '{"name":"pco","gitRepository":{"type":"github","repo":"masinlocandher-max/PCO"}}')"
          elif [ "$status" != '200' ]; then
            printf '%s\n' "$body"
            exit 1
          fi

          project_id="$(printf '%s' "$body" | jq -r '.id // empty')"
          test -n "$project_id"
          linked="$(printf '%s' "$body" | jq -r '(.link.org // "") + "/" + (.link.repo // "")')"
          if [ "$linked" != '/' ] && [ "$linked" != 'masinlocandher-max/PCO' ]; then
            echo "Refusing migration: PCO Vercel project is linked to unexpected repository: $linked"
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Canonical Vercel project: $NEW_PROJECT ($project_id)"

      - name: Fetch canonical PCO source
        run: git clone --depth 1 --branch main https://github.com/masinlocandher-max/PCO.git pco-source

      - name: Link local deploy to PCO project
        run: |
          set -euo pipefail
          mkdir -p pco-source/.vercel
          cat > pco-source/.vercel/project.json <<JSON
          {"projectId":"${{ steps.project.outputs.project_id }}","orgId":"$VERCEL_TEAM_ID"}
          JSON

      - name: Deploy canonical PCO source
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd pco-source
          npx --yes vercel@56.5.0 deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/pco-vercel-deploy.log
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/pco-vercel-deploy.log | tail -n1 || true)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify PCO and standalone News before moving domains
        shell: bash
        run: |
          set -euo pipefail
          root_html="$(curl --fail --silent --show-error --location '${{ steps.deploy.outputs.deployment_url }}/')"
          printf '%s' "$root_html" | grep -qi 'Francine Marie Bautista'
          news_html="$(curl --fail --silent --show-error --location '${{ steps.deploy.outputs.deployment_url }}/news/')"
          printf '%s' "$news_html" | grep -Eqi 'FMB News|FILIPINO MEDIA BULLETIN'
          echo 'Verified PCO root and standalone FMB News rewrite on the new deployment.'

      - name: Move apex and www away from FMB-Ecosystem project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.5.0 domains add francinemariebautista.com "$NEW_PROJECT" --force --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG"
          npx --yes vercel@56.5.0 domains add www.francinemariebautista.com "$NEW_PROJECT" --force --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SLUG"

      - name: Verify production ownership and routes
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.vercel.com'
          auth=(-H "Authorization: Bearer $VERCEL_TOKEN")
          new_domains="$(curl --fail --silent --show-error "${auth[@]}" "$api/v9/projects/$NEW_PROJECT/domains?teamId=$VERCEL_TEAM_ID")"
          printf '%s' "$new_domains" | jq -e '.domains | map(.name) | index("francinemariebautista.com") != null' >/dev/null
          printf '%s' "$new_domains" | jq -e '.domains | map(.name) | index("www.francinemariebautista.com") != null' >/dev/null

          old_domains="$(curl --fail --silent --show-error "${auth[@]}" "$api/v9/projects/$OLD_PROJECT/domains?teamId=$VERCEL_TEAM_ID")"
          if printf '%s' "$old_domains" | jq -e '.domains | map(.name) | index("francinemariebautista.com") != null or index("www.francinemariebautista.com") != null' >/dev/null; then
            echo 'Refusing success: a main domain is still attached to the old FMB-Ecosystem project.'
            exit 1
          fi

          root_html="$(curl --fail --silent --show-error --location https://francinemariebautista.com/)"
          printf '%s' "$root_html" | grep -qi 'Francine Marie Bautista'
          news_html="$(curl --fail --silent --show-error --location https://www.francinemariebautista.com/news/)"
          printf '%s' "$news_html" | grep -Eqi 'FMB News|FILIPINO MEDIA BULLETIN'
          echo 'Production verified: PCO owns the main domains; /news is served by standalone FMBNews.'
