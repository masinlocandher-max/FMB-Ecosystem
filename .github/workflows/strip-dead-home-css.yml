name: Strip dead homepage CSS

on:
  push:
    branches: [cleanup/fmb-ecosystem-hygiene-20260820]
    paths: [.github/workflows/strip-dead-home-css.yml]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fmb-ecosystem-hygiene-20260820
          fetch-depth: 0
      - name: Remove retired selectors
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          css = Path('apps/withlovefmb/assets/css/fmb-unified-system.css')
          s = css.read_text()
          s = s.replace('.fmb-shell-cta,\n.fmb-shell-yoni {', '.fmb-shell-cta {')
          s = re.sub(r'\n\.fmb-shell-yoni \{[\s\S]*?\n\}', '', s, count=1)
          s = s.replace('  .fmb-shell-yoni { display: none; }\n', '')
          s = s.replace(',.fmb-unified-public [class*="ebook-card"]', '')
          s = s.replace(',\n.fmb-unified-public [class*="ebook-card"]', '')
          s = s.replace(',\n.fmb-unified-public [class*="music-card"]', '')
          s = s.replace(',.fmb-unified-public [class*="music-card"]', '')
          s = s.replace(',\n.fmb-unified-public [class*="ebook-card"]:hover', '')
          s = s.replace(',\n.fmb-unified-public [class*="music-card"]:hover', '')
          if 'fmb-shell-yoni' in s or 'ebook-card' in s or 'music-card' in s:
              raise SystemExit('Retired homepage selectors still remain')
          css.write_text(s)
          me = Path('.github/workflows/strip-dead-home-css.yml')
          if me.exists(): me.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove dead retired homepage CSS selectors"
          git push origin HEAD:cleanup/fmb-ecosystem-hygiene-20260820
