name: Monorepo checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  content-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-content.mjs

  boundaries:
    needs: content-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-release-contract.mjs
      - run: node tooling/check-monorepo.mjs
      - run: node tooling/check-deployment-boundaries.mjs
      - run: node --check apps/senz/server.js
      - run: node --check apps/senz/api/handler.js

  static-builds:
    needs: content-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build:fmb
      - run: test -f apps/withlovefmb/dist/index.html
      - run: test -f apps/withlovefmb/dist/app/index.html
      - run: npm run build:senz
      - run: test -f apps/senz/dist/index.html

  cognita-build:
    needs: content-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cognita
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/cognita/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run typecheck
      - run: npm run build

  deploy-fmb-prebuilt-production:
    needs: [content-schema, boundaries, static-builds, cognita-build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deployment credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Link production project
        run: npx --yes vercel@56.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build audited production output locally
        run: npx --yes vercel@56.5.0 build --prod --token="$VERCEL_TOKEN"
      - name: Upload prebuilt production release
        run: npx --yes vercel@56.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
