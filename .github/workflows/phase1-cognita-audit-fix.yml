name: Phase 1 Cognita audit lock refresh

on:
  push:
    branches:
      - repair/phase1-stabilize-existing-build
    paths:
      - '.github/workflows/phase1-cognita-audit-fix.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cognita
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/phase1-stabilize-existing-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/cognita/package-lock.json
      - name: Apply non-force audit fixes to lockfile only
        run: npm audit fix --package-lock-only --workspaces=false --no-fund
      - name: Install refreshed lockfile
        run: npm ci --workspaces=false
      - name: Require clean high-severity audit
        run: npm audit --workspaces=false --audit-level=high
      - name: Typecheck Cognita
        run: npm run typecheck
      - name: Build Cognita
        run: npm run build
      - name: Commit verified lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          cd ../..
          if git diff --quiet -- apps/cognita/package-lock.json; then
            echo 'No lockfile change was required.'
            exit 0
          fi
          git config user.name 'fmb-phase1-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/cognita/package-lock.json
          git commit -m 'Refresh Cognita lockfile for high-severity audit fixes'
          git push origin HEAD:repair/phase1-stabilize-existing-build
