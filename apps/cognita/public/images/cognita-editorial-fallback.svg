<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Cognita learning environment</title>
  <desc id="description">A dark blue editorial illustration of a learner, laptop, books, and connected knowledge nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#0b1f38"/>
      <stop offset="1" stop-color="#122d4c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#000814" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#background)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <g opacity=".42" fill="none" stroke="#7dd3fc" stroke-width="3">
    <path d="M170 230 390 150 560 270 790 120 1030 250 1390 160"/>
    <path d="M170 230 340 430 560 270 770 450 1030 250 1270 430 1390 160"/>
    <circle cx="170" cy="230" r="10" fill="#7dd3fc"/>
    <circle cx="390" cy="150" r="10" fill="#7dd3fc"/>
    <circle cx="560" cy="270" r="10" fill="#7dd3fc"/>
    <circle cx="790" cy="120" r="10" fill="#7dd3fc"/>
    <circle cx="1030" cy="250" r="10" fill="#7dd3fc"/>
    <circle cx="1390" cy="160" r="10" fill="#7dd3fc"/>
    <circle cx="340" cy="430" r="10" fill="#7dd3fc"/>
    <circle cx="770" cy="450" r="10" fill="#7dd3fc"/>
    <circle cx="1270" cy="430" r="10" fill="#7dd3fc"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="340" y="500" width="920" height="470" rx="42" fill="#06101f" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
    <rect x="405" y="555" width="790" height="315" rx="24" fill="url(#screen)"/>
    <g fill="#e0f2fe" opacity=".88">
      <rect x="475" y="625" width="300" height="22" rx="11"/>
      <rect x="475" y="675" width="480" height="14" rx="7" opacity=".68"/>
      <rect x="475" y="711" width="390" height="14" rx="7" opacity=".5"/>
      <rect x="475" y="767" width="215" height="52" rx="18" opacity=".86"/>
    </g>
    <path d="M275 970h1050l-95 90H370z" fill="#132b47" stroke="#ffffff" stroke-opacity=".12" stroke-width="4"/>
  </g>
  <g transform="translate(180 620)">
    <circle cx="80" cy="70" r="54" fill="#dbeafe"/>
    <path d="M24 228c3-83 36-124 99-124s96 41 99 124" fill="#1d4ed8"/>
    <path d="M71 119c18 18 38 18 58 0" fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(1270 690)">
    <rect x="0" y="0" width="180" height="220" rx="20" fill="#e0f2fe" opacity=".92"/>
    <rect x="24" y="34" width="130" height="14" rx="7" fill="#0ea5e9"/>
    <rect x="24" y="70" width="108" height="10" rx="5" fill="#334155" opacity=".55"/>
    <rect x="24" y="98" width="130" height="10" rx="5" fill="#334155" opacity=".4"/>
    <rect x="24" y="126" width="94" height="10" rx="5" fill="#334155" opacity=".35"/>
  </g>
  <text x="800" y="1120" fill="#bae6fd" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="8" text-anchor="middle">COGNITA LEARNING</text>
</svg>
