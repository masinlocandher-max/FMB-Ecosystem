<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc">
  <title id="title">FMB News Impeachment Trial</title>
  <desc id="desc">A neutral FMB News graphic showing an abstract Senate chamber, a gavel, Philippine-inspired colors, and the words Impeachment Trial. No person is depicted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d2b"/>
      <stop offset="0.58" stop-color="#251044"/>
      <stop offset="1" stop-color="#641d55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d59e28"/>
      <stop offset="0.5" stop-color="#f0c85b"/>
      <stop offset="1" stop-color="#bd7c14"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1536" height="864" fill="url(#bg)"/>
  <circle cx="121" cy="158" r="250" fill="#5940a6" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1418" cy="118" r="250" fill="#e3ad35" opacity="0.10" filter="url(#soft)"/>

  <g opacity="0.22">
    <path d="M0 0h520L315 430H0Z" fill="#1d4594"/>
    <path d="M0 864h500L220 405 0 555Z" fill="#a31e46"/>
    <path d="M0 276h288L0 502Z" fill="#ffffff"/>
    <circle cx="82" cy="363" r="37" fill="#e4ad35"/>
    <g fill="#e4ad35">
      <circle cx="30" cy="320" r="7"/><circle cx="133" cy="320" r="7"/><circle cx="82" cy="424" r="7"/>
    </g>
  </g>

  <g transform="translate(82 72)">
    <path d="M0 76a76 76 0 0 1 76-76" fill="none" stroke="#8b63d9" stroke-width="15" stroke-linecap="round"/>
    <path d="M20 76a56 56 0 0 1 56-56" fill="none" stroke="#e4ad35" stroke-width="15" stroke-linecap="round"/>
    <circle cx="76" cy="76" r="8" fill="#e4ad35"/>
    <text x="116" y="63" fill="#ffffff" font-family="Georgia,serif" font-size="64" font-weight="700" letter-spacing="2">FMB</text>
    <text x="120" y="94" fill="#e6dff0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="12">NEWS</text>
  </g>

  <g opacity="0.17" transform="translate(730 118)">
    <path d="M0 150 350 0l350 150Z" fill="#ffffff"/>
    <rect x="40" y="160" width="620" height="30" fill="#ffffff"/>
    <g fill="#ffffff">
      <rect x="88" y="200" width="72" height="310" rx="8"/>
      <rect x="210" y="200" width="72" height="310" rx="8"/>
      <rect x="332" y="200" width="72" height="310" rx="8"/>
      <rect x="454" y="200" width="72" height="310" rx="8"/>
      <rect x="576" y="200" width="72" height="310" rx="8"/>
    </g>
    <rect x="20" y="510" width="660" height="34" fill="#ffffff"/>
    <rect x="0" y="555" width="700" height="40" fill="#ffffff"/>
  </g>

  <g transform="translate(92 242)">
    <rect x="0" y="0" width="780" height="100" rx="8" fill="url(#gold)"/>
    <text x="38" y="70" fill="#12152f" font-family="Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="5">IMPEACHMENT</text>
    <text x="0" y="230" fill="#ffffff" font-family="Arial,sans-serif" font-size="170" font-weight="900" letter-spacing="4">TRIAL</text>
    <rect x="3" y="270" width="675" height="2" fill="#e4ad35"/>
    <text x="0" y="315" fill="#eeeaf4" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">THE FACTS. THE PROCEEDINGS.</text>
    <text x="0" y="355" fill="#eeeaf4" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">WHAT IT MEANS TO US.</text>
  </g>

  <g transform="translate(1100 486) rotate(-18)" filter="url(#shadow)">
    <rect x="-20" y="260" width="350" height="58" rx="29" fill="#241718"/>
    <ellipse cx="155" cy="260" rx="155" ry="40" fill="#4c2d23"/>
    <rect x="136" y="45" width="42" height="250" rx="18" fill="#6d402d"/>
    <rect x="24" y="5" width="266" height="82" rx="34" fill="#5a3327"/>
    <rect x="46" y="20" width="222" height="15" rx="7" fill="#d6a542" opacity="0.8"/>
    <ellipse cx="24" cy="46" rx="37" ry="42" fill="#3a211b"/>
    <ellipse cx="290" cy="46" rx="37" ry="42" fill="#3a211b"/>
  </g>

  <g opacity="0.22">
    <circle cx="1420" cy="724" r="170" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="1420" cy="724" r="120" fill="none" stroke="#e4ad35" stroke-width="2"/>
    <circle cx="1420" cy="724" r="70" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <rect x="0" y="782" width="1536" height="82" fill="#070a1d" opacity="0.88"/>
  <text x="92" y="832" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">CLEARER. SHARPER. FOR EVERY FILIPINO.</text>
  <text x="1444" y="832" fill="#ded8e8" font-family="Arial,sans-serif" font-size="18" text-anchor="end">francinemariebautista.com/fmbnews</text>

  <rect x="1" y="1" width="1534" height="862" fill="none" stroke="url(#glass)" stroke-width="2"/>
</svg>
